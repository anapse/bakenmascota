# Cloudflare Workers Configuration for AI Backend API
name = "ai-backend-api"
main = "worker/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Allowed origins for CORS (comma-separated list for GitHub Pages and local development)
ALLOWED_ORIGINS = "https://anapse.github.io,http://localhost:3000,http://localhost:5173"

# Secrets to configure in Cloudflare via `npx wrangler secret put <NAME>`:
# - GEMINI_API_KEY : Your Google Gemini API Key (Required)
# - API_SECRET_KEY : Optional secret token to restrict API access
# - OPENAI_API_KEY : Optional secondary provider key
